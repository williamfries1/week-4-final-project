<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script src="index.js" defer></script>
    <title>Showtime</title>
  </head>
   <body>
    <nav>
      <div class="logo">
        <img
          src="./assets/fes-logo.png"
          alt=""
          class="logo__img"
          width="50px"
        />
        <div class="logo__title"><span>Flicker</span> Films</div>
      </div>
      <form class="search__form" id="searchForm">
        <div class="search__form-group">
          <input
            class="search__form-input"
            type="text"
            id="searchInput"
            placeholder="Search for movies..."
            required
          />
          <button class="search__form-btn" type="submit">
            <svg
              class="search__form-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </form>
    </nav>

    <main>
      <div class="controls">
        <p id="resultsInfo" class="resultsInfo"><span>Showing: </span></p>
        <div>
          <label for="sortSelect">Sort:</label>
          <select id="sortSelect">
            <option value="default">Default</option>
            <option value="a-z">A - Z</option>
            <option value="z-a">Z - A</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        </div>
      </div>

      <div class="movies__grid" id="moviesGrid">
        
      </div>
    </main>
  </body>
</html>
