<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Best Movie Site Ever!</title>
    <link rel="stylesheet" href="indexstyles1.css" />
    <script src="https://kit.fontawesome.com/49bf7b0baf.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header id="nav__bar">
      <nav>
        <div class="nav__container">
          <img src="./assets/logomoviesite.jpg" class="company__logo" />
          <ul class="nav__links">
            <li>
              <a href="" class="nav__link">Home</a>
            </li>
            <li>
              <a href="" class="nav__link">Find Your Movie</a>
            </li>
            <li>
              <a href="" class="nav__link nav__link--primary">Contact</a>
            </li>
          </ul>
        </div>
        <button class="btn__contact"></button>
      </nav>
    </header>
    <section id="landing">
      <div class="landing__container">
        <div class="section__title">
          <h1 class="section__title--main cyan">
            Most searched movie platform <br />in the United States.
          </h1>
        </div>
        <div class="section__subtitle">
          <h2 class="section__sub--title">
            FIND ALL YOUR MOVIE NEEDS WITH
            <span class="cyan">IT'S SHOWTIME</span>
          </h2>
        </div>
        <div class="search__bar--wrapper">
          <input
            type="text"
            placeholder="Search by Title, Year, or Plot"
            class="search__bar"
          />
          <button class="search__btn">
            <i class="fa-solid fa-spinner"></i>
          </button>
            
        </div>
        <figure class="landing__img--wrapper">
          <img src="./assets/scottpilgrimmontage.webp" alt="" class="landing__img">
        </figure>
      </div>
    </section>
  </body>
</html>
